<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dilana OS — Auditoría Chanchostilla</title><link rel="stylesheet" href="assets/styles.css">
<style>
.aud-wrap{max-width:1200px;margin:0 auto}.aud-sedes{display:grid;grid-template-columns:1fr 1fr;gap:18px}.aud-sede{border:1px solid var(--line);border-radius:14px;padding:18px;background:#fff}.corte{display:flex;justify-content:space-between;gap:10px;background:#f7f8fb;border-radius:10px;padding:10px 12px;margin:10px 0}.total-plato{border:2px solid var(--navy);border-radius:13px;padding:17px;background:#f7f8fb;margin:12px 0}.total-plato span{display:block;color:var(--grey);font-size:.72rem;text-transform:uppercase}.total-plato strong{display:block;color:var(--navy);font-size:2.1rem;margin-top:4px}.listos-grid{display:grid;gap:10px}.listo-card{border:1px solid var(--line);border-radius:11px;padding:13px}.listo-card.limitante{border-color:var(--amber);background:#fff9eb}.listo-top{display:grid;grid-template-columns:1fr 92px;gap:10px}.listo-nombre>strong{display:block;color:var(--navy);font-size:1rem}.cantidad{margin-top:4px;color:var(--grey);font-size:.82rem}.listo-platos{text-align:right}.listo-platos strong{display:block;color:var(--navy);font-size:1.35rem}.listo-platos span{font-size:.66rem;color:var(--grey);text-transform:uppercase}.traza{margin-top:9px;background:#f7f6f2;border-radius:9px;padding:9px;font-size:.72rem;line-height:1.45;color:var(--grey)}.traza strong{color:var(--navy)}.traza-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}.alerta-relacionada{margin-top:8px;border-left:3px solid var(--amber);padding:7px 9px;background:#fff8e8;font-size:.73rem;color:var(--grey)}.costilla-detalle{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}.mini{background:#f7f6f2;border-radius:8px;padding:8px}.mini span{display:block;font-size:.62rem;color:var(--grey);text-transform:uppercase}.mini strong{display:block;color:var(--navy);margin-top:3px}.producir{margin-top:18px;border-top:2px solid var(--line);padding-top:14px}.produccion-card{border:1px dashed var(--line);border-radius:10px;padding:11px;margin-top:8px;background:#fcfbf8}.produccion-card summary{cursor:pointer;font-weight:700;color:var(--navy)}.ok{color:var(--green)}.error{color:var(--red);font-weight:700}.oculto{display:none!important}@media(max-width:820px){.aud-sedes{grid-template-columns:1fr}.costilla-detalle,.traza-grid{grid-template-columns:1fr}.listo-top{grid-template-columns:1fr 72px}}
</style></head>
<body><div class="shell"><aside class="sidebar"><div class="marca">Dilana <span>OS</span></div><nav><a href="inicio.html">Inicio de turno</a><a href="dashboard.html">Disponible Hoy</a><a href="auditoria-chanchostilla.html" class="activo">Auditoría Chanchostilla</a><a href="conteo.html">Registrar conteo</a><a href="producir.html">Registrar producción</a><a href="traslados.html">Traslados</a></nav></aside>
<main class="main"><div class="topbar"><h1>Auditoría Chanchostilla</h1><div id="barra-usuario"></div></div><div class="aud-wrap">
<section class="card" style="border-top:4px solid var(--navy)"><div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap"><div><h2 style="margin:0">Disponibilidad real del plato</h2><p style="margin:5px 0 0;color:var(--grey);font-size:.86rem">Muestra la cantidad usada y el registro exacto del que proviene.</p></div><div style="display:flex;gap:8px;align-items:flex-end"><div class="campo" style="margin:0"><label>Fecha operativa hasta</label><input type="date" id="fecha-hasta"></div><button class="btn dorado" id="btn-analizar">Analizar</button></div></div><div id="estado" style="margin-top:12px"></div></section>
<section id="resumen" class="card oculto"><div id="resumen-contenido"></div></section></div></main></div>
<script src="assets/config.js"></script><script>
Sesion.requerir();const usuario=Sesion.usuario();if(usuario){montarBarraUsuario();if(usuario.rol!=='Administrador'){alert('Esta auditoría es solo para Administración.');location.href='inicio.html';}}
document.getElementById('fecha-hasta').value=fechaLocalHoy_();
const RECETA={costilla:85,panceta:75,papas:100,cebolla:50,alioli:30};
const N={costillaEntera:'Costilla Preparada',costillaPicada:'Costilla Preparada Picada',reduccion:'Reducción Balsámica Preparada',panceta:'Panceta Pre-Ahumada',papas:'Papas Listas',cebolla:'Cebolla Elaborada',alioli:'Alioli'};
const REL={papas:['Papas Pre-Fritas','Papa Capira'],cebolla:['Cebollita de Amelia','Cebolla en Pluma (sin limon)','Cebolla Roja'],panceta:['Panceta Entera'],alioli:['Aceite de oliva','Aceite Girasol','Huevos A']};
const R={entera:3120,reduccion:656,salida:2690};const norm=normalizarTexto;const numero=v=>Number(v||0).toLocaleString('es-CO',{maximumFractionDigits:1});
function fechaBonita(f){if(!f)return 'Sin fecha';const s=String(f);const iso=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(iso)return `${iso[3]}/${iso[2]}/${iso[1]}`;return s;}
function stock(disponible,nombre){const m=disponible?.data?.stock_ingredientes||{};const k=Object.keys(m).find(x=>norm(x)===norm(nombre)||norm(m[x]?.producto)===norm(nombre));return k?{cantidad:Number(m[k].cantidad||0),unidad:m[k].unidad||'g',sinDato:false,nombre:m[k].producto||nombre,fecha:m[k].fecha_conteo||''}:{cantidad:0,unidad:'g',sinDato:true,nombre,fecha:''};}
function filasHistorial(resp){const d=resp?.data??resp??{};const candidatos=[d.conteos,d.filas,d.items,d.historial,d.resultados,Array.isArray(d)?d:null];return candidatos.find(Array.isArray)||[];}
function fechaOp(r){return String(r.fecha||r.fecha_operativa||r.dia||'').slice(0,10)}
function ts(r){const v=r.timestamp||r.fecha_registro||r.creado_en||'';if(v instanceof Date)return v.getTime();const m=String(v).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?/);if(m)return new Date(+m[3],+m[2]-1,+m[1],+m[4],+m[5],+(m[6]||0)).getTime();return Date.parse(v)||0;}
function ultimoExacto(filas,sede,nombre,fechaHasta){return filas.filter(r=>norm(r.sede)===norm(sede)&&norm(r.producto)===norm(nombre)&&fechaOp(r)&&fechaOp(r)<=fechaHasta).sort((a,b)=>fechaOp(b).localeCompare(fechaOp(a))||ts(b)-ts(a))[0]||null;}
function ultimoRelacionado(filas,sede,nombres,fechaHasta){let hallados=[];(nombres||[]).forEach(n=>{const r=ultimoExacto(filas,sede,n,fechaHasta);if(r)hallados.push(r)});return hallados.sort((a,b)=>fechaOp(b).localeCompare(fechaOp(a))||ts(b)-ts(a))[0]||null;}
function traza(r){if(!r)return `<div class="traza"><strong>No existe conteo con este nombre.</strong></div>`;return `<div class="traza"><div class="traza-grid"><span>Fecha operativa: <strong>${fechaBonita(fechaOp(r))}</strong></span><span>Guardado: <strong>${escapeHtml(String(r.timestamp||r.fecha_registro||'Sin hora'))}</strong></span><span>Usuario: <strong>${escapeHtml(r.usuario||'Sin usuario')}</strong></span><span>Punto: <strong>${escapeHtml(r.punto_conteo||'Sin punto')}</strong></span><span>Nombre exacto: <strong>${escapeHtml(r.producto||'')}</strong></span><span>Cantidad registrada: <strong>${numero(r.cantidad)} ${escapeHtml(r.unidad||'')}</strong></span></div></div>`;}
function componente(disponible,filas,sede,clave,nombre,porcion,fechaHasta){const s=stock(disponible,nombre),registro=ultimoExacto(filas,sede,nombre,fechaHasta),rel=ultimoRelacionado(filas,sede,REL[clave],fechaHasta);return{clave,nombre,stock:s,platos:Math.floor(s.cantidad/porcion),registro,rel};}
function costilla(disponible,filas,sede,fechaHasta){const entera=stock(disponible,N.costillaEntera),picada=stock(disponible,N.costillaPicada),reduccion=stock(disponible,N.reduccion);const convertida=Math.max(0,Math.min(entera.cantidad*R.salida/R.entera,reduccion.cantidad*R.salida/R.reduccion));return{clave:'costilla',nombre:'Costilla',stock:{cantidad:picada.cantidad+convertida,unidad:'g'},platos:Math.floor((picada.cantidad+convertida)/RECETA.costilla),detalle:{entera,picada,reduccion,convertida},registros:{entera:ultimoExacto(filas,sede,N.costillaEntera,fechaHasta),picada:ultimoExacto(filas,sede,N.costillaPicada,fechaHasta),reduccion:ultimoExacto(filas,sede,N.reduccion,fechaHasta)}};}
function calcularSede(sede,d,filas,fechaHasta){const comps=[costilla(d,filas,sede,fechaHasta),componente(d,filas,sede,'panceta',N.panceta,RECETA.panceta,fechaHasta),componente(d,filas,sede,'papas',N.papas,RECETA.papas,fechaHasta),componente(d,filas,sede,'cebolla',N.cebolla,RECETA.cebolla,fechaHasta),componente(d,filas,sede,'alioli',N.alioli,RECETA.alioli,fechaHasta)];const total=Math.min(...comps.map(c=>c.platos));return{sede,fechaHasta,total,limitantes:comps.filter(c=>c.platos===total).map(c=>c.nombre),comps};}
function htmlComp(c,total){if(c.clave==='costilla'){const d=c.detalle;return `<div class="listo-card ${c.platos===total?'limitante':''}"><div class="listo-top"><div class="listo-nombre"><strong>Costilla</strong><div class="cantidad">${numero(c.stock.cantidad)} g utilizables</div></div><div class="listo-platos"><strong>${c.platos}</strong><span>platos</span></div></div><div class="costilla-detalle"><div class="mini"><span>Picada lista</span><strong>${numero(d.picada.cantidad)} g</strong>${traza(c.registros.picada)}</div><div class="mini"><span>Preparada convertible</span><strong>${numero(d.entera.cantidad)} g</strong>${traza(c.registros.entera)}</div><div class="mini"><span>Reducción</span><strong>${numero(d.reduccion.cantidad)} g</strong>${traza(c.registros.reduccion)}</div></div></div>`;}
const relacionado=c.stock.sinDato&&c.rel?`<div class="alerta-relacionada"><strong>Relacionado, pero no usado como producto listo:</strong> ${escapeHtml(c.rel.producto)} · ${numero(c.rel.cantidad)} ${escapeHtml(c.rel.unidad||'')} · fecha operativa ${fechaBonita(fechaOp(c.rel))}. Esto explica que exista inventario relacionado, pero el plato siga en cero.</div>`:'';return `<div class="listo-card ${c.platos===total?'limitante':''}"><div class="listo-top"><div class="listo-nombre"><strong>${escapeHtml(c.nombre)}</strong><div class="cantidad">${c.stock.sinDato?'Dilana no encontró conteo con este nombre exacto':`${numero(c.stock.cantidad)} ${escapeHtml(c.stock.unidad)} usados en el cálculo`}</div></div><div class="listo-platos"><strong>${c.platos}</strong><span>platos</span></div></div>${traza(c.registro)}${relacionado}</div>`;}
function pintar(sedes){document.getElementById('resumen').classList.remove('oculto');document.getElementById('resumen-contenido').innerHTML='<div class="aud-sedes">'+sedes.map(s=>`<article class="aud-sede"><h3 style="margin:0">${escapeHtml(s.sede)}</h3><div class="corte"><span>Conteos operativos hasta</span><strong>${fechaBonita(s.fechaHasta)}</strong></div><div class="total-plato"><span>Total completo listo para vender</span><strong>${s.total} platos</strong></div><p style="font-size:.82rem;color:var(--grey)">Limita: <strong>${escapeHtml(s.limitantes.join(', '))}</strong></p><div class="listos-grid">${s.comps.map(c=>htmlComp(c,s.total)).join('')}</div></article>`).join('')+'</div>';}
async function analizar(){const fecha=document.getElementById('fecha-hasta').value;if(!fecha)return;const estado=document.getElementById('estado');estado.innerHTML='<p class="vacio">Comparando Disponible Hoy con los conteos reales…</p>';const [sa,capri,hsa,hcapri]=await Promise.all([llamar('disponible_hoy',{fecha,sede:'San Antonio'}),llamar('disponible_hoy',{fecha,sede:'Capri'}),llamar('conteos_historial',{sede:'San Antonio',fecha_hasta:fecha,limite:5000}),llamar('conteos_historial',{sede:'Capri',fecha_hasta:fecha,limite:5000})]);if(!sa.ok||!capri.ok){estado.innerHTML='<p class="error">No se pudo consultar Disponible Hoy.</p>';return;}const filas=[...filasHistorial(hsa),...filasHistorial(hcapri)];pintar([calcularSede('San Antonio',sa,filas,fecha),calcularSede('Capri',capri,filas,fecha)]);estado.innerHTML=filas.length?'<p class="ok"><strong>Análisis terminado.</strong> Ya puedes ver el renglón exacto usado detrás de cada cantidad.</p>':'<p class="error">Disponible Hoy respondió, pero el historial no devolvió filas. Las cantidades se muestran, pero no fue posible enseñar usuario y hora.</p>';}
document.getElementById('btn-analizar').addEventListener('click',conBotonProtegido(document.getElementById('btn-analizar'),analizar));analizar();
</script></body></html>
