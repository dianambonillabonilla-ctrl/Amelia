name: Aplicar perfiles y permisos

on:
  push:
    branches:
      - agent/perfiles-permisos

permissions:
  contents: write

jobs:
  aplicar:
    if: github.event.head_commit.message != 'Aplicar perfiles y permisos'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Aplicar migración
        run: node scripts/aplicar-perfiles-permisos.cjs
      - name: Ejecutar pruebas
        run: npm test
      - name: Commit de cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script assets usuarios.html tests package.json
          git commit -m "Aplicar perfiles y permisos"
          git push
