name: Patch reactivacion FUDO

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/usuarios-sincronizacion-fudo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Abrir solo acciones FUDO aprobadas
        shell: python
        run: |
          from pathlib import Path
          p = Path('apps-script/Code.gs')
          s = p.read_text(encoding='utf-8')
          old = """  'usuarios_listar',
  'usuarios_guardar',
  'usuario_resetear_password'
];"""
          new = """  'usuarios_listar',
  'usuarios_guardar',
  'usuario_resetear_password',
  'fudo_panel_estado',
  'fudo_api_probar_conexion',
  'fudo_api_sincronizar_ventas',
  'fudo_api_sincronizar_pagos'
];"""
          if new in s:
              print('El candado ya está actualizado.')
          elif old in s:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
              print('Candado actualizado.')
          else:
              raise SystemExit('No se encontró la lista blanca esperada; no se modificó Code.gs.')
      - name: Commit del cambio mínimo
        run: |
          if git diff --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/Code.gs
          git commit -m "Reactivación: habilitar sincronización manual FUDO"
          git push origin HEAD:${{ github.head_ref }}
