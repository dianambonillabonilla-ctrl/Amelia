name: Limpieza navegación fase 1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/limpieza-navegacion-fase1.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Unificar navegación y retirar enlaces legacy
        shell: python
        run: |
          from pathlib import Path

          # 1) inicio.html: reemplazar el menú fijo por la fuente única de assets/config.js.
          inicio = Path('inicio.html')
          texto = inicio.read_text(encoding='utf-8')
          comienzo = texto.find('    <nav>')
          fin = texto.find('    </nav>', comienzo)
          if comienzo == -1 or fin == -1:
              raise SystemExit('No se encontró el menú fijo esperado en inicio.html')
          fin += len('    </nav>')
          texto = texto[:comienzo] + '    <nav id="menu-nav"></nav>' + texto[fin:]
          inicio.write_text(texto, encoding='utf-8')

          # 2) config.js: base-caja deja de aparecer en el menú, pero el archivo se conserva.
          config = Path('assets/config.js')
          texto = config.read_text(encoding='utf-8')
          linea_base = "  { href: 'base-caja.html', texto: 'Base de caja anterior', soloRol: ['Administrador'] }\n"
          linea_diag = "  { href: 'diagnostico.html', texto: 'Diagnóstico', soloRol: ['Administrador'] },\n"
          if linea_base not in texto:
              raise SystemExit('No se encontró la entrada Base de caja anterior en config.js')
          texto = texto.replace(linea_base, '')
          # La entrada anterior queda como última del arreglo: retirar su coma final.
          texto = texto.replace(linea_diag, linea_diag.rstrip(',\n') + '\n')
          texto = texto.replace('// por si alguien entra directo por URL en vez de por el menú. Redirige al dashboard.',
                                '// por si alguien entra directo por URL en vez de por el menú. Redirige al inicio.')
          texto = texto.replace("window.location.href = 'dashboard.html';", "window.location.href = 'inicio.html';")
          config.write_text(texto, encoding='utf-8')

          # 3) Todos los enlaces sueltos hacia el home antiguo pasan al inicio actual.
          for archivo in Path('.').rglob('*.html'):
              if archivo.name == 'dashboard.html':
                  continue
              contenido = archivo.read_text(encoding='utf-8')
              nuevo = contenido.replace('dashboard.html', 'inicio.html')
              if nuevo != contenido:
                  archivo.write_text(nuevo, encoding='utf-8')

          # El workflow es temporal; se elimina en el mismo commit de resultado.
          Path('.github/workflows/limpieza-navegacion-fase1.yml').unlink()

      - name: Verificar cambios
        run: |
          grep -q '<nav id="menu-nav"></nav>' inicio.html
          ! grep -q "Base de caja anterior" assets/config.js
          ! grep -R "dashboard.html" --include='*.html' --include='*.js' . --exclude='dashboard.html'
          git diff --check

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unificar navegación y retirar enlaces legacy"
          git push
