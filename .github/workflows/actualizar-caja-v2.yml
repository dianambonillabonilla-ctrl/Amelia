name: Actualizar Caja V2
on:
  push:
    paths:
      - '.github/workflows/actualizar-caja-v2.yml'
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar interfaz de Caja
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('caja.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<div class="dinero"><span>Base esperada del cierre anterior</span><strong id="base-esperada">$0</strong></div>\n            <div class="dinero"><span>Dinero contado al abrir</span><input type="number" min="0" step="1" id="base-contada" style="margin-top:8px"></div>', '<div class="dinero"><span>Efectivo esperado del cierre anterior</span><strong id="base-esperada">$0</strong></div>\n            <div class="dinero"><span>Efectivo contado al abrir</span><input type="number" min="0" step="1" id="base-contada" style="margin-top:8px"></div>\n            <div class="dinero"><span>Caja fuerte esperada</span><strong id="fuerte-esperada">$0</strong></div>\n            <div class="dinero"><span>Caja fuerte contada al abrir</span><input type="number" min="0" step="1" id="fuerte-contada-apertura" style="margin-top:8px"></div>')
          s=s.replace('<div class="dinero"><span>Entregado al administrador</span><strong id="d-entregas">$0</strong></div>\n            <div class="dinero"><span>Gastos y salidas</span><strong id="d-gastos">$0</strong></div>\n            <div class="dinero principal"><span>Efectivo esperado</span><strong id="d-esperado">$0</strong></div>', '<div class="dinero"><span>Enviado a caja fuerte</span><strong id="d-envio-fuerte">$0</strong></div>\n            <div class="dinero"><span>Entregado al administrador</span><strong id="d-entregas">$0</strong></div>\n            <div class="dinero"><span>Gastos y salidas</span><strong id="d-gastos">$0</strong></div>\n            <div class="dinero principal"><span>Efectivo esperado en caja</span><strong id="d-esperado">$0</strong></div>\n            <div class="dinero principal"><span>Esperado en caja fuerte</span><strong id="d-fuerte">$0</strong></div>\n            <div class="dinero principal"><span>Total bajo custodia</span><strong id="d-total">$0</strong></div>')
          s=s.replace('<select id="mov-tipo"><option>Entrega administrador</option><option>Gasto</option><option>Otro ingreso</option></select>', '<select id="mov-tipo"><option>Envío a caja fuerte</option><option>Retiro de caja fuerte</option><option>Entrega administrador desde caja</option><option>Entrega administrador desde caja fuerte</option><option>Gasto</option><option>Otro ingreso</option></select>')
          s=s.replace('<div class="advertencia">Cuenta todo el efectivo. Después indica cuánto se deja como base y quién recibe el dinero restante.</div>\n            <div class="campo"><label>Efectivo contado físicamente</label><input type="number" min="0" step="1" id="cierre-contado"></div>\n            <div class="campo"><label>Base para el siguiente turno</label><input type="number" min="0" step="1" id="cierre-base"></div>\n            <div class="campo"><label>Quién recibe el dinero restante</label><input id="cierre-recibe"></div>', '<div class="advertencia">Cuenta por separado el efectivo operativo y el dinero guardado en caja fuerte.</div>\n            <div class="campo"><label>Efectivo contado en caja operativa</label><input type="number" min="0" step="1" id="cierre-contado"></div>\n            <div class="campo"><label>Efectivo que queda para abrir el siguiente turno</label><input type="number" min="0" step="1" id="cierre-base"></div>\n            <div class="campo"><label>Dinero contado en caja fuerte</label><input type="number" min="0" step="1" id="cierre-fuerte"></div>\n            <div class="campo"><label>Persona que verifica el cierre</label><input id="cierre-recibe"></div>')
          s=s.replace("document.getElementById('base-contada').value=data.base_esperada||0;", "document.getElementById('base-contada').value=data.base_esperada||0;\n    document.getElementById('fuerte-esperada').textContent=dinero(data.caja_fuerte_esperada||0);\n    document.getElementById('fuerte-contada-apertura').value=data.caja_fuerte_esperada||0;")
          s=s.replace("document.getElementById('d-entregas').textContent='−'+dinero(data.movimientos_resumen.entregas_administrador);", "document.getElementById('d-envio-fuerte').textContent='−'+dinero(data.movimientos_resumen.envios_caja_fuerte||0);\n  document.getElementById('d-entregas').textContent='−'+dinero(data.movimientos_resumen.entregas_administrador||0);")
          s=s.replace("document.getElementById('d-esperado').textContent=dinero(data.efectivo_esperado);", "document.getElementById('d-esperado').textContent=dinero(data.efectivo_esperado);\n  document.getElementById('d-fuerte').textContent=dinero(data.caja_fuerte_esperada||0);\n  document.getElementById('d-total').textContent=dinero(data.total_bajo_custodia||0);")
          s=s.replace("document.getElementById('cierre-base').value=data.apertura.base_inicial||0;", "document.getElementById('cierre-base').value=data.apertura.base_inicial||0;\n  document.getElementById('cierre-fuerte').value=data.caja_fuerte_esperada||0;")
          s=s.replace("document.getElementById('mov-tipo').addEventListener('change',()=>document.getElementById('datos-entrega').style.display=document.getElementById('mov-tipo').value==='Entrega administrador'?'block':'none');", "document.getElementById('mov-tipo').addEventListener('change',()=>{const t=document.getElementById('mov-tipo').value;document.getElementById('datos-entrega').style.display=t.indexOf('Entrega administrador')===0?'block':'none';});")
          s=s.replace("const item={...parametros(),base_inicial:document.getElementById('base-contada').value,observacion_apertura:document.getElementById('observacion-apertura').value.trim()};", "const item={...parametros(),base_inicial:document.getElementById('base-contada').value,caja_fuerte_inicial:document.getElementById('fuerte-contada-apertura').value,observacion_apertura:document.getElementById('observacion-apertura').value.trim()};")
          s=s.replace("const item={...parametros(),efectivo_contado:contado,base_siguiente:base,persona_recibe_cierre:document.getElementById('cierre-recibe').value.trim(),observacion:document.getElementById('cierre-observacion').value.trim()};", "const item={...parametros(),efectivo_contado:contado,caja_fuerte_contada:Number(document.getElementById('cierre-fuerte').value||0),base_siguiente:base,persona_recibe_cierre:document.getElementById('cierre-recibe').value.trim(),observacion:document.getElementById('cierre-observacion').value.trim()};")
          s=s.replace("if(contado-base>0&&!item.persona_recibe_cierre){alert('Escribe quién recibe el dinero restante.');return;}", "if(!item.persona_recibe_cierre){alert('Escribe quién verifica el cierre.');return;}")
          s=s.replace("const resta=m.tipo!=='Otro ingreso';", "const resta=m.tipo!=='Otro ingreso' && m.tipo!=='Retiro de caja fuerte';")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verificar JavaScript embebido
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('caja.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,re.S)
          Path('/tmp/caja-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/caja-inline.js
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add caja.html
          git commit -m "Actualizar Caja con caja fuerte y entregas separadas" || exit 0
          git push
