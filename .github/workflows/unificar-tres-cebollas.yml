name: Unificar tres cebollas

on:
  push:
    paths:
      - '.github/workflows/unificar-tres-cebollas.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar auditoría
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('auditoria-chanchostilla.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("cebolla:'Cebolla en Pluma'", "cebolla:'Cebolla Pluma'")
          s=s.replace("cebolla:['Cebolla Elaborada','Cebollita de Amelia','Cebolla en Pluma (sin limon)']", "cebolla:['Cebolla en Pluma','Cebolla Elaborada','Cebollita de Amelia','Cebollita de Amelia Preparada','Cebolla Amelia','Cebolla en Pluma (sin limon)','Cebolla en Pluma (sin limón)']")
          s=s.replace('Cebolla en Pluma', 'Cebolla Pluma')
          # Restaurar alias históricos después del reemplazo global
          s=s.replace("cebolla:['Cebolla Pluma','Cebolla Elaborada','Cebollita de Amelia','Cebollita de Amelia Preparada','Cebolla Amelia','Cebolla Pluma (sin limon)','Cebolla Pluma (sin limón)']", "cebolla:['Cebolla en Pluma','Cebolla Elaborada','Cebollita de Amelia','Cebollita de Amelia Preparada','Cebolla Amelia','Cebolla en Pluma (sin limon)','Cebolla en Pluma (sin limón)']")
          if "cebolla:'Cebolla Pluma'" not in s:
              raise SystemExit('No quedó Cebolla Pluma como nombre oficial')
          p.write_text(s,encoding='utf-8')
          Path('.github/workflows/unificar-tres-cebollas.yml').unlink()
          PY
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auditoria-chanchostilla.html .github/workflows/unificar-tres-cebollas.yml
          git commit -m "Usar Cebolla Pluma como nombre oficial"
          git push
