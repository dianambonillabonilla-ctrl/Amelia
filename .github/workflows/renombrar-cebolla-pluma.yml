name: Renombrar cebolla en pluma

on:
  push:
    paths:
      - '.github/workflows/renombrar-cebolla-pluma.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar auditoría
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('auditoria-chanchostilla.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace("cebolla:'Cebolla Elaborada'", "cebolla:'Cebolla en Pluma'")
          s = s.replace("cebolla:['Cebollita de Amelia','Cebolla en Pluma (sin limon)','Cebolla Roja']", "cebolla:['Cebolla Elaborada','Cebollita de Amelia','Cebolla en Pluma (sin limon)']")
          s = s.replace("platos:Math.floor(s.cantidad/porcion)", "platos:Math.max(0,Math.floor(s.cantidad/porcion))")
          s = s.replace("const total=Math.min(...comps.map(c=>c.platos));", "const total=Math.max(0,Math.min(...comps.map(c=>c.platos)));" )
          p.write_text(s, encoding='utf-8')
          Path('.github/workflows/renombrar-cebolla-pluma.yml').unlink()
          PY
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auditoria-chanchostilla.html .github/workflows/renombrar-cebolla-pluma.yml
          git commit -m "Usar Cebolla en Pluma y bloquear platos negativos"
          git push
