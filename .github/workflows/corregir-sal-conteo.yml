name: Corregir conteo de sal en papas

on:
  push:
    paths:
      - '.github/workflows/corregir-sal-conteo.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corregir nombre y trazabilidad de sal
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('auditoria-chanchostilla.html')
          s=p.read_text(encoding='utf-8')

          s=s.replace("sal:'Sal normal'", "sal:'Sal'")
          s=s.replace("// Sal normal es el nombre oficial de la receta (corregido: las Papas Listas NO usan sal marina).\n// Estos son nombres históricos con los que se pudo haber contado el mismo insumo en alguna sede —\n// si \"Sal normal\" no tiene conteo, se busca entre ellos SOLO para avisar (no se suma al cálculo),\n// igual que ya se hace con los alias de cebolla/panceta/alioli.\n", "// La receta de Papas Listas usa Sal. Sal marina es un producto diferente.\n")
          s=s.replace("sal:['Sal Marina Molida','Sal Marina','Sal']", "sal:['Sal normal']")

          old="function papas(d,filas,sede,fecha){const listas=stock(d,N.papas),pre=stock(d,N.papasPre),ajo=stock(d,N.ajo),sal=stock(d,N.sal),perejil=stock(d,N.perejil);const relSal=sal.sinDato?relacionado(filas,sede,REL.sal,fecha):null;const producible=Math.max(0,pre.cantidad*RP.salida/RP.pre);const total=listas.cantidad+producible;return{clave:'papas',nombre:'Papas',stock:{cantidad:total,unidad:'g'},platos:Math.max(0,Math.floor(total/RECETA.papas)),detalle:{listas,pre,ajo,sal,perejil,producible,relSal},registros:{listas:ultimo(filas,sede,N.papas,fecha),pre:ultimo(filas,sede,N.papasPre,fecha),ajo:ultimo(filas,sede,N.ajo,fecha),sal:ultimo(filas,sede,N.sal,fecha),perejil:ultimo(filas,sede,N.perejil,fecha)}}}"
          new="function papas(d,filas,sede,fecha){const listas=stock(d,N.papas),pre=stock(d,N.papasPre),ajo=stock(d,N.ajo),sal=stock(d,N.sal),perejil=stock(d,N.perejil);const registroSal=ultimo(filas,sede,N.sal,fecha)||ultimo(filas,sede,'Sal normal',fecha);if(sal.sinDato&&registroSal){sal.cantidad=Math.max(0,Number(registroSal.cantidad||0));sal.unidad=registroSal.unidad||'g';sal.sinDato=false;sal.nombre=registroSal.producto||N.sal}const producible=Math.max(0,pre.cantidad*RP.salida/RP.pre);const total=listas.cantidad+producible;return{clave:'papas',nombre:'Papas',stock:{cantidad:total,unidad:'g'},platos:Math.max(0,Math.floor(total/RECETA.papas)),detalle:{listas,pre,ajo,sal,perejil,producible},registros:{listas:ultimo(filas,sede,N.papas,fecha),pre:ultimo(filas,sede,N.papasPre,fecha),ajo:ultimo(filas,sede,N.ajo,fecha),sal:registroSal,perejil:ultimo(filas,sede,N.perejil,fecha)}}}"
          if old not in s:
              raise SystemExit('No se encontró la función papas esperada')
          s=s.replace(old,new)

          s=s.replace("const relSalHtml=d.relSal?`<div class=\"alerta-relacionada\"><strong>Relacionado, pero no usado como Sal normal:</strong> ${escapeHtml(d.relSal.producto)} · ${numero(d.relSal.cantidad)} ${escapeHtml(d.relSal.unidad||'')} · ${fechaBonita(fechaOp(d.relSal))}</div>`:'';", "")
          s=s.replace("<span>Sal normal</span><strong>${numero(d.sal.cantidad)} g</strong>${traza(c.registros.sal)}${relSalHtml}", "<span>Sal</span><strong>${numero(d.sal.cantidad)} g</strong>${traza(c.registros.sal)}")

          if "sal:'Sal normal'" in s or 'Relacionado, pero no usado como Sal normal' in s:
              raise SystemExit('Persistió la lógica anterior de sal')
          p.write_text(s,encoding='utf-8')
          Path('.github/workflows/corregir-sal-conteo.yml').unlink()
          PY
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auditoria-chanchostilla.html .github/workflows/corregir-sal-conteo.yml
          git commit -m "Mostrar conteo de Sal como sal de la receta"
          git push
