name: Completar limpieza UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/completar-limpieza-ui.yml'

permissions:
  contents: write

jobs:
  migrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Aplicar limpieza completa
        shell: python
        run: |
          from pathlib import Path
          import re

          # 1. Menú centralizado, permisos y redirección de acceso denegado.
          p = Path('assets/config.js')
          s = p.read_text(encoding='utf-8')
          nuevo_menu = """const MENU_PRINCIPAL = [
            { grupo: 'HOY' },
            { href: 'inicio.html', texto: 'Inicio de turno' },
            { href: 'abastecimiento.html', texto: 'Inventario y abastecimiento', soloRol: ['Administrador', 'Encargado', 'Lectura'] },
            { href: 'caja.html', texto: 'Caja', soloRol: ['Administrador', 'Encargado', 'Cocina'] },

            { grupo: 'REGISTRAR OPERACIÓN' },
            { href: 'conteo.html', texto: 'Conteo de inventario', soloRol: ['Administrador', 'Encargado', 'Cocina'] },
            { href: 'producir.html', texto: 'Producción', soloRol: ['Administrador', 'Encargado', 'Cocina'] },
            { href: 'traslados.html', texto: 'Traslados', soloRol: ['Administrador', 'Encargado', 'Cocina'] },
            { href: 'compras.html', texto: 'Compras', soloRol: ['Administrador', 'Encargado', 'Cocina'] },
            { href: 'gestiones.html', texto: 'Novedades', soloRol: ['Administrador', 'Encargado', 'Cocina'] },

            { grupo: 'CONTROL Y REVISIÓN' },
            { href: 'conciliacion.html', texto: 'Conciliación', soloRol: ['Administrador', 'Encargado', 'Lectura'] },
            { href: 'inventario-ubicacion.html', texto: 'Inventario por ubicación', soloRol: ['Administrador', 'Encargado', 'Lectura'] },
            { href: 'libro-inventario.html', texto: 'Libro de inventario', soloRol: ['Administrador', 'Encargado', 'Lectura'] },
            { href: 'historiales.html', texto: 'Históricos', soloRol: ['Administrador', 'Encargado', 'Lectura'] },

            { grupo: 'CONFIGURACIÓN' },
            { href: 'recetas.html', texto: 'Recetas', soloRol: ['Administrador'] },
            { href: 'catalogo.html', texto: 'Catálogo de productos', soloRol: ['Administrador', 'Encargado', 'Cocina'] },
            { href: 'fudo.html', texto: 'Panel FUDO', soloRol: ['Administrador', 'Encargado'] },
            { href: 'importar.html', texto: 'Importar de FUDO', soloRol: ['Administrador'] },
            { href: 'diagnostico.html', texto: 'Diagnóstico', soloRol: ['Administrador'] },
            { href: 'usuarios.html', texto: 'Usuarios', soloRol: ['Administrador'] }
          ];"""
          s, n = re.subn(r"const MENU_PRINCIPAL = \[.*?\n\];", nuevo_menu, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('No se pudo reemplazar MENU_PRINCIPAL')
          s = s.replace('Redirige al dashboard.', 'Redirige al inicio.')
          s = s.replace("window.location.href = 'dashboard.html';", "window.location.href = 'inicio.html';")
          s = s.replace('dashboard.html (avisa al abrir la app', 'inicio.html (avisa al abrir la app')
          p.write_text(s, encoding='utf-8')

          # 2. Inicio usa el menú dinámico. Se mantienen las tarjetas como accesos rápidos.
          p = Path('inicio.html')
          s = p.read_text(encoding='utf-8')
          s, n = re.subn(r'<nav>.*?</nav>', '<nav id="menu-nav"></nav>', s, count=1, flags=re.S)
          if n != 1 and '<nav id="menu-nav"></nav>' not in s:
              raise SystemExit('No se pudo unificar el menú de inicio.html')
          # Consolidar las cinco tarjetas históricas en una sola.
          patron = r'(?:\s*<a class="accion" href="historial-(?:conteos|producciones|mermas|conciliacion|cierres-turno)\.html".*?</a>){5}'
          tarjeta = '\n          <a class="accion" href="historiales.html" data-solo-rol="Administrador,Encargado,Lectura"><strong>Históricos</strong><span>Conteos, producción, mermas, conciliaciones y cierres en una sola pantalla.</span></a>'
          s = re.sub(patron, tarjeta, s, count=1, flags=re.S)
          p.write_text(s, encoding='utf-8')

          # 3. Pantalla única de Históricos con pestañas internas.
          historiales = '''<!DOCTYPE html>
          <html lang="es">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Dilana OS — Históricos</title>
          <link rel="stylesheet" href="assets/styles.css">
          </head>
          <body>
          <div class="shell">
            <aside class="sidebar"><div class="marca">Dilana <span>OS</span></div><nav id="menu-nav"></nav></aside>
            <main class="main">
              <div class="topbar"><h1>Históricos</h1><div id="barra-usuario"></div></div>
              <section class="card historiales-card">
                <p class="historiales-intro">Consulta los registros anteriores sin llenar el menú lateral de enlaces separados.</p>
                <div class="tabs historiales-tabs" role="tablist">
                  <button class="tab-btn activo" data-url="historial-conteos.html">Conteos</button>
                  <button class="tab-btn" data-url="historial-producciones.html">Producción</button>
                  <button class="tab-btn" data-url="historial-mermas.html">Mermas</button>
                  <button class="tab-btn" data-url="historial-conciliacion.html">Conciliación</button>
                  <button class="tab-btn" data-url="historial-cierres-turno.html">Cierres</button>
                </div>
                <iframe id="historial-frame" class="historiales-frame" src="historial-conteos.html" title="Consulta de históricos"></iframe>
              </section>
            </main>
          </div>
          <script src="assets/config.js"></script>
          <script>
          Sesion.requerir();
          requerirRol_(['Administrador','Encargado','Lectura']);
          montarBarraUsuario();
          const frame=document.getElementById('historial-frame');
          document.querySelectorAll('.historiales-tabs .tab-btn').forEach(btn=>{
            btn.addEventListener('click',()=>{
              document.querySelectorAll('.historiales-tabs .tab-btn').forEach(b=>b.classList.remove('activo'));
              btn.classList.add('activo');
              frame.src=btn.dataset.url;
            });
          });
          </script>
          </body>
          </html>'''
          Path('historiales.html').write_text(historiales, encoding='utf-8')

          # 4. Páginas legacy quedan como redirecciones estables para marcadores antiguos.
          redirects = {
            'dashboard.html': ('inicio.html', 'Inicio'),
            'auditoria-chanchostilla.html': ('conciliacion.html', 'Conciliación'),
            'conciliacion-chanchostilla.html': ('conciliacion.html', 'Conciliación'),
            'diagnostico-conexion.html': ('diagnostico.html', 'Diagnóstico'),
            'base-caja.html': ('caja.html', 'Caja')
          }
          for nombre, (destino, titulo) in redirects.items():
              Path(nombre).write_text(f'''<!DOCTYPE html>
          <html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <meta http-equiv="refresh" content="0; url={destino}"><title>Dilana OS — {titulo}</title></head>
          <body><p>Esta pantalla fue integrada. <a href="{destino}">Ir a {titulo}</a>.</p>
          <script>window.location.replace('{destino}');</script></body></html>''', encoding='utf-8')

          # 5. Cualquier enlace restante al dashboard viejo va al inicio.
          for archivo in Path('.').glob('*.html'):
              if archivo.name == 'dashboard.html':
                  continue
              t = archivo.read_text(encoding='utf-8')
              t2 = t.replace('dashboard.html', 'inicio.html')
              if t2 != t:
                  archivo.write_text(t2, encoding='utf-8')

          # 6. Mover estilos inline de las pantallas activas al CSS compartido.
          css = Path('assets/styles.css')
          css_text = css.read_text(encoding='utf-8')
          for nombre in ['inicio.html', 'caja.html', 'abastecimiento.html']:
              p = Path(nombre)
              t = p.read_text(encoding='utf-8')
              bloques = re.findall(r'<style>(.*?)</style>', t, flags=re.S)
              if bloques:
                  marca = f'/* ===== Estilos migrados desde {nombre} ===== */'
                  if marca not in css_text:
                      css_text += '\n\n' + marca + '\n' + '\n'.join(b.strip() for b in bloques) + '\n'
                  t = re.sub(r'<style>.*?</style>', '', t, flags=re.S)
                  p.write_text(t, encoding='utf-8')
          # Sistema de pestañas compartido en abastecimiento.
          p = Path('abastecimiento.html')
          t = p.read_text(encoding='utf-8').replace('tab-principal', 'tab-btn')
          p.write_text(t, encoding='utf-8')

          if '/* ===== Históricos unificados ===== */' not in css_text:
              css_text += '''

          /* ===== Históricos unificados ===== */
          .historiales-card{padding:18px}.historiales-intro{margin:0 0 14px;color:var(--grey)}
          .historiales-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
          .historiales-tabs .tab-btn{flex:1 1 130px}
          .historiales-frame{width:100%;min-height:72vh;border:1px solid var(--line);border-radius:12px;background:#fff}
          @media(max-width:760px){.historiales-frame{min-height:78vh}.historiales-tabs .tab-btn{flex:1 1 calc(50% - 8px)}}
          '''
          css.write_text(css_text, encoding='utf-8')

      - name: Verificar resultado
        run: |
          grep -q "href: 'historiales.html'" assets/config.js
          ! grep -q "base-caja.html.*Base de caja anterior" assets/config.js
          ! grep -q "window.location.href = 'dashboard.html'" assets/config.js
          grep -q '<nav id="menu-nav"></nav>' inicio.html
          test -f historiales.html
          grep -q "requerirRol_\(\['Administrador','Encargado','Lectura'\]\)" historiales.html
          ! grep -q '<style>' inicio.html
          ! grep -q '<style>' caja.html
          ! grep -q '<style>' abastecimiento.html
          ! grep -q 'tab-principal' abastecimiento.html
          git diff --check

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Completar limpieza de navegación, históricos y estilos"
          git push
