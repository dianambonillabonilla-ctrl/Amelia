name: Corregir alioli Chanchostilla a 35 g

on:
  push:
    paths:
      - '.github/workflows/corregir-alioli-chanchostilla-35g.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cambiar gramaje de alioli
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('auditoria-chanchostilla.html')
          s=p.read_text(encoding='utf-8')
          old="const RECETA={costilla:85,panceta:75,papas:100,cebolla:50,alioli:30};"
          new="const RECETA={costilla:85,panceta:75,papas:100,cebolla:50,alioli:35};"
          if old not in s:
              raise SystemExit('No se encontró alioli en 30 g')
          s=s.replace(old,new,1)
          if new not in s:
              raise SystemExit('No quedó alioli en 35 g')
          p.write_text(s,encoding='utf-8')
          Path('.github/workflows/corregir-alioli-chanchostilla-35g.yml').unlink()
          PY
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auditoria-chanchostilla.html .github/workflows/corregir-alioli-chanchostilla-35g.yml
          git commit -m "Usar 35 g de alioli por Chanchostilla"
          git push
