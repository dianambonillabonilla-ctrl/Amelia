name: Actualizar OpenAPI de Fudo

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-fudo-openapi.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar especificación oficial
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 3 \
            https://api.fu.do/v1alpha1/openapi.yml \
            --output /tmp/fudo-openapi.yml

      - name: Validar especificación
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path('/tmp/fudo-openapi.yml')
          text = path.read_text(encoding='utf-8')
          data = yaml.safe_load(text)

          assert isinstance(data, dict), 'El archivo no contiene un objeto YAML válido.'
          assert data.get('openapi') == '3.1.0', 'Versión OpenAPI inesperada.'
          assert data.get('info', {}).get('version') == 'v1alpha1', 'Versión de API inesperada.'

          paths = data.get('paths') or {}
          required = {
              '/sales', '/items', '/subitems', '/payments', '/payment-methods',
              '/products', '/ingredients', '/expenses', '/providers',
              '/rooms', '/tables', '/users'
          }
          missing = sorted(required - set(paths))
          assert not missing, f'Faltan endpoints obligatorios: {missing}'
          assert len(paths) >= 30, f'La especificación parece incompleta: solo {len(paths)} rutas.'
          assert len(text.splitlines()) >= 5000, 'La especificación parece truncada.'

          operation_ids = sum(
              1
              for item in paths.values()
              if isinstance(item, dict)
              for operation in item.values()
              if isinstance(operation, dict) and operation.get('operationId')
          )
          assert operation_ids >= 60, f'La especificación parece incompleta: solo {operation_ids} operaciones.'

          print(f'OpenAPI válido: {len(paths)} rutas, {operation_ids} operaciones, {len(text.splitlines())} líneas.')
          PY

      - name: Reemplazar copia del repositorio
        run: |
          cp /tmp/fudo-openapi.yml apps-script/fudo-openapi.yml

      - name: Confirmar cambio
        run: |
          set -euo pipefail
          if git diff --quiet -- apps-script/fudo-openapi.yml; then
            echo 'La copia del repositorio ya estaba actualizada.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps-script/fudo-openapi.yml
          git commit -m 'Actualizar especificación completa de Fudo'
          git push
