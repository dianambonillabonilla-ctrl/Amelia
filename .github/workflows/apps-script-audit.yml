name: Auditoría Apps Script

on:
  push:
    branches:
      - respaldo-apps-script
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ejecutar auditoría estática
        run: node tests/apps-script-audit.js
