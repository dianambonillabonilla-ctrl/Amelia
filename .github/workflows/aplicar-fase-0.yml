name: Aplicar Fase 0

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  aplicar:
    if: github.head_ref == 'agent/fase-0-aplicar-codigo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Aplicar candados de Fase 0
        run: |
          python scripts/aplicar_fase_0.py
          python scripts/ajustar_pruebas_fase0.py

      - name: Ejecutar pruebas completas
        run: |
          npm ci
          npm test

      - name: Guardar cambios solo si las pruebas pasaron
        run: |
          if git diff --quiet; then
            echo "Fase 0 ya estaba aplicada."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/Code.gs apps-script/FudoApi.gs assets/config.js tests/helpers/entorno-apps-script.js tests/fase-0-reactivacion.test.js package.json
          git commit -m "Bloquear completamente módulos durante Fase 0"
          git push origin HEAD:${{ github.head_ref }}
