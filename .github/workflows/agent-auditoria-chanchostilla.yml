name: Integrar auditoría Chanchostilla

on:
  push:
    branches: [agent/auditoria-chanchostilla]
    paths: [.github/workflows/agent-auditoria-chanchostilla.yml]

permissions:
  contents: write

jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/auditoria-chanchostilla
          fetch-depth: 0

      - name: Crear backend y vista
        run: |
          cat > apps-script/AuditoriaChanchostilla.gs <<'EOF'
          /**
           * Auditoría enfocada en Chanchostilla.
           * Cruza, desde el primer conteo disponible, ventas FUDO, receta, conteos físicos,
           * producción, traslados y ajustes de sus cinco componentes por sede.
           */
          function auditoriaChanchostilla_(fechaHasta, usuario) {
            if (typeof conCacheDeTablas_ === 'function') {
              return conCacheDeTablas_(function () { return auditoriaChanchostillaSinCache_(fechaHasta, usuario); });
            }
            return auditoriaChanchostillaSinCache_(fechaHasta, usuario);
          }

          function auditoriaChanchostillaSinCache_(fechaHasta, usuario) {
            fechaHasta = fechaHasta || Utilities.formatDate(new Date(), Session.getScriptTimeZone(), 'yyyy-MM-dd');
            const indice = indiceCatalogo_();
            const componentesNombres = [
              'Costilla Preparada Picada', 'Panceta Pre-Ahumada', 'Papas Listas',
              'Cebolla Elaborada', 'Alioli'
            ];
            const componentes = {};
            componentesNombres.forEach(function (n) { componentes[claveProducto_(n, indice)] = n; });

            const sedeRestringida = sedeRestringidaConciliacion_(usuario);
            const sedes = sedeRestringida ? [sedeRestringida] : ['San Antonio', 'Capri'];
            const conteos = leerTabla_(SHEET_NAMES.CONTEOS).filter(function (c) {
              return sedes.indexOf(c.sede) !== -1 && formatearFecha_(c.fecha) <= fechaHasta;
            });
            const fechasConteo = conteos.map(function (c) { return formatearFecha_(c.fecha); }).filter(Boolean).sort();
            if (!fechasConteo.length) return { ok: true, fecha_desde: null, fecha_hasta: fechaHasta, sedes: [], alertas: ['No hay conteos manuales para auditar.'] };
            const fechaDesde = fechasConteo[0];
            const fechas = rangoDeFechas_(fechaDesde, fechaHasta);
            const cacheVentas = {};

            function conteoDelDia_(fecha, sede) {
              const salida = {};
              conteos.forEach(function (c) {
                if (c.sede !== sede || formatearFecha_(c.fecha) !== fecha) return;
                const clave = claveProducto_(c.producto, indice);
                if (!componentes[clave]) return;
                const base = aUnidadBase_(c.cantidad, c.unidad);
                if (!salida[clave]) salida[clave] = { cantidad: 0, unidad: base.unidad };
                if (salida[clave].unidad === base.unidad) salida[clave].cantidad += base.cantidad;
              });
              return salida;
            }

            const resultadoSedes = sedes.map(function (sede) {
              let conteoAnterior = {};
              const dias = [];
              let ventasAcumuladas = 0;
              let diasConDiferencia = 0;
              let diasSinConteo = 0;

              fechas.forEach(function (fecha) {
                const recetaMap = recetaMapVigenteMemoizado_(fecha, sede, indice, cacheVentas);
                const ventasData = typeof ventasFudoLineasParaConsumo_ === 'function'
                  ? ventasFudoLineasParaConsumo_(fecha, { sin_canceladas: true, sede: sede })
                  : ventasFudoLineasParaFecha_(fecha, { sin_canceladas: true, sede: sede });
                const ventas = ventasData.lineas || [];
                const ventasCh = ventas.filter(function (v) {
                  const n = normalizar_(v.producto);
                  return n === 'chanchostilla' || n === 'cono chanchostilla';
                });
                const unidadesCh = ventasCh.reduce(function (a, v) { return a + (Number(v.cantidad) || 0); }, 0);
                ventasAcumuladas += unidadesCh;

                const consumoCh = {};
                ventasCh.forEach(function (v) {
                  const clave = claveRecetaVenta_(v.producto, recetaMap, indice);
                  if (recetaMap[clave]) explotarReceta_(clave, Number(v.cantidad) || 0, recetaMap, consumoCh, indice);
                });

                const consumoTotal = {};
                movimientosDesdeVentas_(fecha, sede, indice, cacheVentas).forEach(function (m) {
                  const clave = claveProducto_(m.producto, indice);
                  consumoTotal[clave] = (consumoTotal[clave] || 0) + Math.abs(Number(m.cantidad) || 0);
                });

                const conciliacion = conciliarComidaPorSede_(fecha, sede)[sede] || [];
                const conciliacionPorClave = {};
                conciliacion.forEach(function (r) { conciliacionPorClave[claveProducto_(r.ingrediente, indice)] = r; });
                const conteoHoy = conteoDelDia_(fecha, sede);
                const tieneConteo = Object.keys(conteoHoy).length > 0;
                if (!tieneConteo) diasSinConteo++;

                const detalle = Object.keys(componentes).map(function (clave) {
                  const c = conciliacionPorClave[clave] || {};
                  const total = Number(consumoTotal[clave] || 0);
                  const ch = Number(consumoCh[clave] ? consumoCh[clave].cantidad : 0);
                  const otro = Math.max(0, total - ch);
                  const anterior = conteoAnterior[clave] ? conteoAnterior[clave].cantidad : null;
                  const cierre = conteoHoy[clave] ? conteoHoy[clave].cantidad : null;
                  const implicito = c.implicito === null || c.implicito === undefined ? null : Number(c.implicito);
                  return {
                    ingrediente: componentes[clave],
                    unidad: c.unidad || (conteoHoy[clave] && conteoHoy[clave].unidad) || (conteoAnterior[clave] && conteoAnterior[clave].unidad) || 'g',
                    conteo_anterior: anterior,
                    conteo_cierre: cierre,
                    consumo_chanchostilla: Number(ch.toFixed(3)),
                    consumo_otros_platos: Number(otro.toFixed(3)),
                    consumo_total_ventas: Number(total.toFixed(3)),
                    producido: c.producido_registrado === undefined ? null : c.producido_registrado,
                    traslado_neto: c.traslado_neto === undefined ? null : c.traslado_neto,
                    ajuste_neto: c.ajuste_neto === undefined ? null : c.ajuste_neto,
                    diferencia_no_explicada: implicito
                  };
                });
                if (detalle.some(function (d) { return d.diferencia_no_explicada !== null && Math.abs(d.diferencia_no_explicada) >= 1; })) diasConDiferencia++;
                if (tieneConteo) conteoAnterior = conteoHoy;
                if (unidadesCh || tieneConteo || detalle.some(function (d) { return d.producido || d.traslado_neto || d.ajuste_neto; })) {
                  dias.push({ fecha: fecha, ventas_chanchostilla: unidadesCh, tiene_conteo: tieneConteo, componentes: detalle });
                }
              });

              const disp = calcularDisponibleHoy_(fechaHasta, sede);
              const plato = (disp.platos || []).find(function (p) {
                const n = normalizar_(p.producto);
                return n === 'chanchostilla' || n === 'cono chanchostilla';
              }) || null;

              return {
                sede: sede,
                ventas_acumuladas: ventasAcumuladas,
                dias_auditados: dias.length,
                dias_con_diferencia: diasConDiferencia,
                dias_sin_conteo: diasSinConteo,
                disponible_actual: plato ? plato.preparaciones_posibles : null,
                limitante_actual: plato ? (plato.cadena_limitante || plato.ingrediente_limitante) : null,
                dias: dias
              };
            });

            const alertas = [];
            const tieneAlias = leerTabla_(SHEET_NAMES.CATALOGO_ALIAS).some(function (a) { return normalizar_(a.alias) === 'chanchostilla'; });
            if (!tieneAlias) alertas.push('La venta FUDO se resuelve mediante una regla interna hacia Cono Chanchostilla; conviene unificar el nombre oficial en catálogo y receta.');
            const conteoCebollita = conteos.some(function (c) { return normalizar_(c.producto) === 'cebollita de amelia'; });
            if (conteoCebollita) alertas.push('Hay conteos bajo “Cebollita de Amelia” separados de “Cebolla Elaborada”; pueden producir diferencias artificiales.');
            if (!leerTabla_(SHEET_NAMES.PRODUCCIONES).some(function (p) { return normalizar_(p.item) === 'costilla preparada picada'; })) {
              alertas.push('No hay producciones registradas de Costilla Preparada Picada; la transformación en sede no queda auditada.');
            }

            return { ok: true, producto: 'Chanchostilla', receta: { costilla: 85, panceta: 75, papas: 100, cebolla: 50, alioli: 30 }, fecha_desde: fechaDesde, fecha_hasta: fechaHasta, sedes: resultadoSedes, alertas: alertas };
          }
          EOF

          python - <<'PY'
          from pathlib import Path

          # Alias de venta FUDO -> receta vigente.
          p = Path('apps-script/Recetas.gs')
          t = p.read_text(encoding='utf-8')
          old = "    'falafel': 'Falafel',\n    'wafflebonitos': 'Waffle Bonitos'"
          new = "    'falafel': 'Falafel',\n    'wafflebonitos': 'Waffle Bonitos',\n    'chanchostilla': 'Cono Chanchostilla'"
          if old not in t: raise SystemExit('No se encontró mapa de alias de recetas')
          p.write_text(t.replace(old, new, 1), encoding='utf-8')

          # Acción API.
          p = Path('apps-script/Code.gs')
          t = p.read_text(encoding='utf-8')
          old = "      case 'conciliacion_historial_desfases':\n        requiereRol_(sesion.usuario, ['Administrador', 'Encargado', 'Lectura']);\n        return jsonOut_(conciliacionHistorialDesfases_(params.fecha_desde, params.fecha_hasta, sesion.usuario));"
          new = old + "\n      case 'auditoria_chanchostilla':\n        requiereAdmin_(sesion.usuario);\n        return jsonOut_(auditoriaChanchostilla_(params.fecha_hasta, sesion.usuario));"
          if old not in t: raise SystemExit('No se encontró acción de conciliación')
          p.write_text(t.replace(old, new, 1), encoding='utf-8')

          # Pestaña y panel en Disponible Hoy.
          p = Path('dashboard.html')
          t = p.read_text(encoding='utf-8')
          old = '<button class="tab-btn" type="button" data-tab="todo" role="tab">📦 Todo lo que tengo hoy</button>'
          new = old + '\n      <button class="tab-btn" id="tab-auditoria-ch" type="button" data-tab="auditoria-ch" role="tab" style="display:none">🔎 Auditoría Chanchostilla</button>'
          if old not in t: raise SystemExit('No se encontró pestaña Todo')
          t = t.replace(old, new, 1)

          anchor = '''    <div class="tab-panel" data-panel="todo" hidden>'''
          panel = '''    <div class="tab-panel" data-panel="auditoria-ch" hidden>
      <div class="card" style="border-top:4px solid var(--navy)">
        <div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap">
          <div><h2 style="margin:0">Auditoría de Chanchostilla</h2><p style="margin:5px 0 0;color:var(--grey);font-size:.85rem">Desde el primer conteo: ventas, conteos, producción, traslados, ajustes y diferencias.</p></div>
          <button class="btn fantasma" id="btn-cargar-auditoria-ch" type="button">Analizar historial</button>
        </div>
        <div id="auditoria-ch-contenido"><p class="vacio">Pulsa “Analizar historial” para comprobar el sistema.</p></div>
      </div>
    </div>

'''
          if anchor not in t: raise SystemExit('No se encontró panel Todo')
          t = t.replace(anchor, panel + anchor, 1)

          old = "let sedeCorteActual = '';"
          new = old + "\nlet auditoriaChCargada_ = false;"
          t = t.replace(old, new, 1)

          old = "  if (tab === 'todo') {"
          new = "  if (tab === 'auditoria-ch' && !auditoriaChCargada_) cargarAuditoriaChanchostilla_();\n  if (tab === 'todo') {"
          if old not in t: raise SystemExit('No se encontró activar pestaña')
          t = t.replace(old, new, 1)

          insert_before = "document.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', () => activarPestanaDisponible_(b.dataset.tab)));"
          functions = r'''
function numeroAuditoria_(v) { return v === null || v === undefined ? '—' : Number(v).toLocaleString('es-CO', { maximumFractionDigits: 1 }); }
function claseDiferenciaAuditoria_(v) { return v === null || v === undefined ? '' : Math.abs(Number(v)) < 1 ? 'color:var(--green)' : 'color:var(--red);font-weight:700'; }
function tablaDiaAuditoria_(dia) {
  return `<details style="border-top:1px solid var(--line);padding:10px 0">
    <summary style="cursor:pointer;font-weight:700">${escapeHtml(dia.fecha)} · ${escapeHtml(dia.ventas_chanchostilla)} Chanchostilla(s) vendida(s) ${dia.tiene_conteo ? '· con conteo' : '· sin conteo'}</summary>
    <div style="overflow-x:auto;margin-top:8px"><table><thead><tr><th>Componente</th><th>Conteo anterior</th><th>Conteo cierre</th><th>Consumo Chanchostilla</th><th>Otros platos</th><th>Producción</th><th>Traslado neto</th><th>Ajustes</th><th>No explicado</th></tr></thead><tbody>
    ${dia.componentes.map(c => `<tr><td>${escapeHtml(c.ingrediente)}</td><td>${numeroAuditoria_(c.conteo_anterior)} ${escapeHtml(c.unidad)}</td><td>${numeroAuditoria_(c.conteo_cierre)} ${escapeHtml(c.unidad)}</td><td>${numeroAuditoria_(c.consumo_chanchostilla)}</td><td>${numeroAuditoria_(c.consumo_otros_platos)}</td><td>${numeroAuditoria_(c.producido)}</td><td>${numeroAuditoria_(c.traslado_neto)}</td><td>${numeroAuditoria_(c.ajuste_neto)}</td><td style="${claseDiferenciaAuditoria_(c.diferencia_no_explicada)}">${numeroAuditoria_(c.diferencia_no_explicada)}</td></tr>`).join('')}
    </tbody></table></div></details>`;
}
function pintarAuditoriaChanchostilla_(data) {
  const cont = document.getElementById('auditoria-ch-contenido');
  if (!data.ok) { cont.innerHTML = `<p style="color:var(--red)">${escapeHtml(data.error || 'No se pudo analizar.')}</p>`; return; }
  const alertas = (data.alertas || []).length ? `<div class="card card-alerta aviso" style="margin:14px 0"><strong>Hallazgos que afectan la confiabilidad</strong><ul>${data.alertas.map(a => `<li>${escapeHtml(a)}</li>`).join('')}</ul></div>` : '';
  cont.innerHTML = `<p style="color:var(--grey);font-size:.82rem">Periodo revisado: ${escapeHtml(data.fecha_desde || '—')} a ${escapeHtml(data.fecha_hasta)}. Receta auditada por unidad: 85 g costilla picada, 75 g panceta, 100 g papas, 50 g cebolla y 30 g alioli.</p>${alertas}` +
    (data.sedes || []).map(s => `<section style="margin-top:18px"><h3>${escapeHtml(s.sede)}</h3><div class="resumen-dia"><div class="stat ok"><div class="valor">${escapeHtml(s.ventas_acumuladas)}</div><div class="etiqueta">Vendidas en el periodo</div></div><div class="stat ${s.dias_con_diferencia ? 'critico' : 'ok'}"><div class="valor">${escapeHtml(s.dias_con_diferencia)}</div><div class="etiqueta">Días con diferencia</div></div><div class="stat ${s.dias_sin_conteo ? 'aviso' : 'ok'}"><div class="valor">${escapeHtml(s.dias_sin_conteo)}</div><div class="etiqueta">Días sin conteo</div></div><div class="stat ok"><div class="valor">${s.disponible_actual === null ? '—' : escapeHtml(s.disponible_actual)}</div><div class="etiqueta">Disponibles al corte</div></div></div><p style="font-size:.84rem"><strong>Limitante actual:</strong> ${escapeHtml(s.limitante_actual || '—')}</p>${(s.dias || []).map(tablaDiaAuditoria_).join('')}</section>`).join('');
}
async function cargarAuditoriaChanchostilla_() {
  const usuario = Sesion.usuario();
  if (!usuario || usuario.rol !== 'Administrador') return;
  const cont = document.getElementById('auditoria-ch-contenido');
  cont.innerHTML = '<p class="vacio">Analizando todos los conteos y ventas de Chanchostilla…</p>';
  const data = await llamar('auditoria_chanchostilla', { fecha_hasta: document.getElementById('fecha-corte').value });
  auditoriaChCargada_ = true;
  pintarAuditoriaChanchostilla_(data);
}
'''
          if insert_before not in t: raise SystemExit('No se encontró listener de pestañas')
          t = t.replace(insert_before, functions + '\n' + insert_before, 1)

          old = "document.getElementById('fecha-corte').value = fechaLocalHoy_();"
          new = old + "\nif (Sesion.usuario() && Sesion.usuario().rol === 'Administrador') document.getElementById('tab-auditoria-ch').style.display = '';"
          t = t.replace(old, new, 1)

          old = "document.getElementById('btn-actualizar').addEventListener('click', cargar);"
          new = old + "\ndocument.getElementById('btn-cargar-auditoria-ch').addEventListener('click', () => { auditoriaChCargada_ = false; cargarAuditoriaChanchostilla_(); });"
          if old not in t: raise SystemExit('No se encontró botón actualizar')
          t = t.replace(old, new, 1)
          p.write_text(t, encoding='utf-8')

          # Prueba de regresión del alias.
          p = Path('tests/recipe-engine.test.js')
          t = p.read_text(encoding='utf-8')
          anchor = "console.log('recipe-engine: OK');"
          test = """
assert.strictEqual(
  ctx.claveRecetaVenta_('Chanchostilla', { 'cono chanchostilla': { tipo: 'plato' } }, {}),
  'cono chanchostilla',
  'La venta FUDO Chanchostilla debe usar la receta vigente Cono Chanchostilla'
);

"""
          if anchor not in t: raise SystemExit('No se encontró cierre del test')
          p.write_text(t.replace(anchor, test + anchor, 1), encoding='utf-8')
          PY

      - name: Ejecutar pruebas
        run: npm test

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/AuditoriaChanchostilla.gs apps-script/Recetas.gs apps-script/Code.gs dashboard.html tests/recipe-engine.test.js
          git commit -m "Agregar auditoría histórica de Chanchostilla"
          git push origin agent/auditoria-chanchostilla
