name: Corregir disponibilidad de papas pre-fritas

on:
  push:
    paths:
      - '.github/workflows/corregir-papas-prefritas-disponibles.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar corrección
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('auditoria-chanchostilla.html')
          s=p.read_text(encoding='utf-8')

          patron=r"function papas\(d,filas,sede,fecha\)\{.*?\}\nfunction apoyoCentro"
          nuevo="""function papas(d,filas,sede,fecha){const listas=stock(d,N.papas),pre=stock(d,N.papasPre),ajo=stock(d,N.ajo),sal=stock(d,N.sal),perejil=stock(d,N.perejil);const producible=Math.max(0,pre.cantidad*RP.salida/RP.pre);const total=listas.cantidad+producible;return{clave:'papas',nombre:'Papas',stock:{cantidad:total,unidad:'g'},platos:Math.max(0,Math.floor(total/RECETA.papas)),detalle:{listas,pre,ajo,sal,perejil,producible},registros:{listas:ultimo(filas,sede,N.papas,fecha),pre:ultimo(filas,sede,N.papasPre,fecha),ajo:ultimo(filas,sede,N.ajo,fecha),sal:ultimo(filas,sede,N.sal,fecha)||ultimo(filas,sede,'Sal normal',fecha),perejil:ultimo(filas,sede,N.perejil,fecha)}}}
function apoyoCentro"""
          s,n=re.subn(patron,nuevo,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit('No se encontró la función papas esperada')

          s=s.replace("<strong>Limitante:</strong> ${escapeHtml(d.limitantes.map(k=>nombres[k]).join(', '))}","<strong>Estado:</strong> Requiere fritura final")
          s=s.replace("const nombres={pre:'Papas Pre-Fritas',ajo:'Ajo Preparado',sal:'Sal normal',perejil:'Perejil Picado'};","")
          s=s.replace("const nombres={pre:'Papas Pre-Fritas',ajo:'Ajo Preparado',sal:'Sal',perejil:'Perejil Picado'};","")
          s=s.replace("Para producir 1.000 g de Papas Listas se requieren 1.754 g de Papas Pre-Fritas, 20 g de Ajo Preparado, 10 g de Sal normal y 20 g de Perejil Picado.","Las Papas Pre-Fritas cuentan como papas disponibles después de la fritura final. La conversión usada es 1.754 g de Papas Pre-Fritas por 1.000 g de Papas Listas. Ajo, sal y perejil se muestran como insumos de terminación, pero no bloquean el cálculo de platos.")
          s=s.replace("Para producir 1.000 g de Papas Listas se requieren 1.754 g de Papas Pre-Fritas, 20 g de Ajo Preparado, 10 g de Sal y 20 g de Perejil Picado.","Las Papas Pre-Fritas cuentan como papas disponibles después de la fritura final. La conversión usada es 1.754 g de Papas Pre-Fritas por 1.000 g de Papas Listas. Ajo, sal y perejil se muestran como insumos de terminación, pero no bloquean el cálculo de platos.")
          s=s.replace('<span>Adicionales al terminar</span>','<span>Disponibles tras fritura final</span>')

          if 'Math.min(porPre' in s or 'd.limitantes' in s:
              raise SystemExit('Quedó lógica antigua de limitantes')
          p.write_text(s,encoding='utf-8')
          Path('.github/workflows/corregir-papas-prefritas-disponibles.yml').unlink()
          PY
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auditoria-chanchostilla.html .github/workflows/corregir-papas-prefritas-disponibles.yml
          git commit -m "Contar papas pre-fritas como disponibles tras fritura final"
          git push
