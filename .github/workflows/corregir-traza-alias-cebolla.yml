name: Corregir trazabilidad alias cebolla

on:
  push:
    paths:
      - '.github/workflows/corregir-traza-alias-cebolla.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar corrección
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('auditoria-chanchostilla.html')
          s=p.read_text(encoding='utf-8')
          viejo="function componente(d,filas,sede,clave,nombre,porcion,fecha){const s=stock(d,nombre);return{clave,nombre,stock:s,platos:Math.max(0,Math.floor(s.cantidad/porcion)),registro:ultimo(filas,sede,nombre,fecha),rel:relacionado(filas,sede,REL[clave],fecha)}}"
          nuevo="function componente(d,filas,sede,clave,nombre,porcion,fecha){const s=stock(d,nombre);const alias=REL[clave]||[];const registro=ultimo(filas,sede,nombre,fecha)||relacionado(filas,sede,alias,fecha);return{clave,nombre,stock:s,platos:Math.max(0,Math.floor(s.cantidad/porcion)),registro,rel:null}}"
          if viejo not in s:
              raise SystemExit('No se encontró el bloque esperado')
          s=s.replace(viejo,nuevo)
          s=s.replace('<head>','<head>\n<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">',1)
          p.write_text(s,encoding='utf-8')
          Path('.github/workflows/corregir-traza-alias-cebolla.yml').unlink()
          PY
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auditoria-chanchostilla.html .github/workflows/corregir-traza-alias-cebolla.yml
          git commit -m "Mostrar conteos históricos como origen de Cebolla en Pluma"
          git push
