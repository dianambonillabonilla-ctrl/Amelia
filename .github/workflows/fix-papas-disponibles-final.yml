name: Corregir papas disponibles final

on:
  push:
    paths:
      - '.github/workflows/fix-papas-disponibles-final.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reemplazar lógica de papas
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('auditoria-chanchostilla.html')
          s=p.read_text(encoding='utf-8')
          old="function papas(d,filas,sede,fecha){const listas=stock(d,N.papas),pre=stock(d,N.papasPre),ajo=stock(d,N.ajo),sal=stock(d,N.sal),perejil=stock(d,N.perejil);const relSal=sal.sinDato?relacionado(filas,sede,REL.sal,fecha):null;const porPre=pre.cantidad*RP.salida/RP.pre;const porAjo=ajo.cantidad*RP.salida/RP.ajo;const porSal=sal.cantidad*RP.salida/RP.sal;const porPerejil=perejil.cantidad*RP.salida/RP.perejil;const producible=Math.max(0,Math.min(porPre,porAjo,porSal,porPerejil));const total=listas.cantidad+producible;const capacidades={pre:porPre,ajo:porAjo,sal:porSal,perejil:porPerejil};const min=Math.min(...Object.values(capacidades));const limitantes=Object.keys(capacidades).filter(k=>Math.abs(capacidades[k]-min)<0.01);return{clave:'papas',nombre:'Papas',stock:{cantidad:total,unidad:'g'},platos:Math.max(0,Math.floor(total/RECETA.papas)),detalle:{listas,pre,ajo,sal,perejil,producible,limitantes,relSal},registros:{listas:ultimo(filas,sede,N.papas,fecha),pre:ultimo(filas,sede,N.papasPre,fecha),ajo:ultimo(filas,sede,N.ajo,fecha),sal:ultimo(filas,sede,N.sal,fecha),perejil:ultimo(filas,sede,N.perejil,fecha)}}}"
          new="function papas(d,filas,sede,fecha){const listas=stock(d,N.papas),pre=stock(d,N.papasPre),ajo=stock(d,N.ajo),sal=stock(d,N.sal),perejil=stock(d,N.perejil);const relSal=sal.sinDato?relacionado(filas,sede,REL.sal,fecha):null;const producible=Math.max(0,pre.cantidad*RP.salida/RP.pre);const total=listas.cantidad+producible;return{clave:'papas',nombre:'Papas',stock:{cantidad:total,unidad:'g'},platos:Math.max(0,Math.floor(total/RECETA.papas)),detalle:{listas,pre,ajo,sal,perejil,producible,relSal},registros:{listas:ultimo(filas,sede,N.papas,fecha),pre:ultimo(filas,sede,N.papasPre,fecha),ajo:ultimo(filas,sede,N.ajo,fecha),sal:ultimo(filas,sede,N.sal,fecha),perejil:ultimo(filas,sede,N.perejil,fecha)}}}"
          if old not in s:
              raise SystemExit('No se encontró la función papas exacta')
          s=s.replace(old,new)
          s=s.replace("const nombres={pre:'Papas Pre-Fritas',ajo:'Ajo Preparado',sal:'Sal normal',perejil:'Perejil Picado'};","")
          s=s.replace("<span>Adicionales al terminar</span>","<span>Disponibles para vender tras fritura</span>")
          s=s.replace("<strong>Limitante:</strong> ${escapeHtml(d.limitantes.map(k=>nombres[k]).join(', '))}","<strong>Estado:</strong> Solo requiere fritura final")
          s=s.replace("Para producir 1.000 g de Papas Listas se requieren 1.754 g de Papas Pre-Fritas, 20 g de Ajo Preparado, 10 g de Sal normal y 20 g de Perejil Picado.","Papas Listas y Papas Pre-Fritas cuentan como disponibles para vender. Las Pre-Fritas se convierten usando 1.754 g por cada 1.000 g de Papas Listas y solo requieren fritura final.")
          if 'Math.min(porPre' in s or 'd.limitantes' in s:
              raise SystemExit('Persistió la lógica antigua')
          p.write_text(s,encoding='utf-8')
          Path('.github/workflows/fix-papas-disponibles-final.yml').unlink()
          PY
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auditoria-chanchostilla.html .github/workflows/fix-papas-disponibles-final.yml
          git commit -m "Contar papas listas y pre-fritas como disponibles para vender"
          git push
