          example: invalid-attribute
        title:
          type: string
          example: Unprocessable Entity
        detail:
          type: string
          example: name can't be blank
        source:
          type: object
          properties:
            pointer:
              type: string
              example: /data/attributes/name
            parameter:
              type: string
        meta:
          type: object
          additionalProperties: true
    error:
      type: object
      properties:
        errors:
          type: array
          items: *id069
  responses:
    badRequest:
      description: "The request was malformed or a referenced relationship is missing.\n"
      content:
        application/json:
          schema: *id001
          examples:
            invalidBody:
              value:
                errors:
                - status: '400'
                  code: bad-request
            noMatchingRelationship:
              value:
                errors:
                - status: '400'
                  code: no-matching-relationship
                  detail: Relationship customer with id 5 is not present
    unauthorized:
      description: Authentication is missing or the token is invalid/expired.
      content:
        application/json:
          schema: *id001
          examples:
            unauthorized:
              value:
                errors:
                - status: '401'
                  code: unauthorized
    forbidden:
      description: "The authenticated user does not have permission to perform\nthis
        action.\n"
      content:
        application/json:
          schema: *id001
          examples:
            forbidden:
              value:
                errors:
                - status: '403'
                  code: forbidden
    notFound:
      description: Resource not found.
      content:
        application/json:
          schema: *id001
          examples:
            notFound:
              value:
                errors:
                - status: '404'
                  code: not-found
    unprocessable:
      description: "A resource attribute or business rule failed validation. The\n\
        title and detail are localized (default es).\n"
      content:
        application/json:
          schema: *id001
          examples:
            invalidAttribute:
              value:
                errors:
                - status: '422'
                  code: invalid_attribute
                  title: Atributo inválido
                  detail: El valor de Nombre ya está tomado
    tooManyRequests:
      description: "Rate limit exceeded. Retry after the number of seconds indicated\n\
        by the Retry-After header. The body is currently plain text, not\na JSON:API
        error.\n"
      content:
        text/plain:
          schema:
            type: string
            example: Retry later
