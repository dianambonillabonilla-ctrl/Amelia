    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "From here you can assign a value to the authorization header to
        be able\nto perform tests from this interface. The value to assign must be
        the\ntoken obtained from the authentication endpoint, as explained above.\n\
        \n###\n"
