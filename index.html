<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dilana OS — Iniciar sesión</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="login-shell">
  <div class="login-card">
    <div class="marca"><h1>Dilana <span>OS</span></h1></div>
    <p style="text-align:center;color:var(--grey);font-size:.85rem;margin:-10px 0 20px">Ingresa para administrar los módulos activos.</p>
    <form id="form-login">
      <div class="campo">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" required autocomplete="username">
      </div>
      <div class="campo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button class="btn" type="submit" style="width:100%">Entrar</button>
      <p class="error-msg" id="error" style="display:none"></p>
    </form>
  </div>
</div>

<script src="assets/config.js"></script>
<script>
document.getElementById('form-login').addEventListener('submit', async (e) => {
  e.preventDefault();
  const usuario = document.getElementById('usuario').value.trim();
  const password = document.getElementById('password').value;
  const errorEl = document.getElementById('error');
  errorEl.style.display = 'none';

  const data = await llamar('login', { usuario, password });
  if (!data.ok) {
    errorEl.textContent = data.error || 'No se pudo iniciar sesión';
    errorEl.style.display = 'block';
    return;
  }

  Sesion.guardar(data.token, data.usuario);

  if (MODO_REACTIVACION) {
    if (['Administrador', 'Encargado'].includes(data.usuario.rol) && MODULOS_ACTIVOS.includes('sincronizacion')) {
      window.location.href = 'fudo.html';
      return;
    }

    // En esta etapa los demás usuarios siguen existiendo, pero sus módulos operativos todavía
    // están apagados. Se cierra la sesión para no dejar una cuenta navegando URLs antiguas.
    try { await llamar('logout'); } catch (err) {}
    Sesion.limpiarLocal();
    errorEl.textContent = 'Tu cuenta está activa, pero por ahora solo están habilitados Usuarios y Sincronización FUDO.';
    errorEl.style.display = 'block';
    return;
  }

  window.location.href = 'inicio.html';
});
</script>
</body>
</html>
