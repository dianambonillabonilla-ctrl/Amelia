<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dilana OS — Histórico de Caja</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="marca">Dilana <span>OS</span></div>
    <nav id="menu-nav"></nav>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Histórico de Caja</h1>
      <div id="barra-usuario"></div>
    </div>

    <div class="card">
      <p style="color:var(--grey); font-size:.85rem; margin-top:0">
        Días anteriores de Caja, con lo que quedó guardado en cada apertura/cierre — no se
        recalcula nada en vivo. Toca un día para verlo en detalle en Caja.
      </p>
      <div class="grid grid-4" style="margin-bottom:14px">
        <div class="campo"><label>Desde</label><input type="date" id="filtro-desde"></div>
        <div class="campo"><label>Hasta</label><input type="date" id="filtro-hasta"></div>
        <div class="campo">
          <label>Sede</label>
          <select id="filtro-sede">
            <option value="Ambas">Ambas (todas)</option>
            <option>San Antonio</option>
            <option>Capri</option>
          </select>
        </div>
        <div class="campo" style="display:flex; align-items:flex-end">
          <button class="btn dorado" id="btn-filtrar" style="width:100%">Filtrar</button>
        </div>
      </div>
      <p id="contador" class="vacio" style="display:none"></p>
    </div>

    <div id="lista-historial"></div>
  </main>
</div>

<script src="assets/config.js"></script>
<script>
if (new URLSearchParams(location.search).get('embed') === '1') document.body.classList.add('embebido');
Sesion.requerir();
requerirRol_(['Administrador', 'Encargado']);
montarBarraUsuario();
restringirSelectorSede_(document.getElementById('filtro-sede'));
// Caja solo existe en sedes de venta; Centro de Producción no debe aparecer aquí.
Array.from(document.getElementById('filtro-sede').options).forEach(o => { if (o.value === 'Centro de Producción') o.remove(); });

const hoy = fechaLocalHoy_();
const hace30dias = (() => {
  const d = new Date();
  d.setDate(d.getDate() - 30);
  return d.toISOString().slice(0, 10);
})();
document.getElementById('filtro-desde').value = hace30dias;
document.getElementById('filtro-hasta').value = hoy;

document.getElementById('btn-filtrar').addEventListener('click', cargar);
cargar();

async function cargar() {
  const params = {
    fecha_desde: document.getElementById('filtro-desde').value,
    fecha_hasta: document.getElementById('filtro-hasta').value,
    sede: document.getElementById('filtro-sede').value
  };
  const data = await llamar('caja_historial_listar', params);
  if (!data.ok) { alert(data.error); return; }
  const filas = data.historial || [];
  document.getElementById('contador').style.display = 'block';
  document.getElementById('contador').textContent = filas.length
    ? `${filas.length} día(s) en el rango`
    : 'No hay cajas en este rango.';
  pintar(filas);
}

function dinero_(n) {
  return Number(n || 0).toLocaleString('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 });
}

function pintar(filas) {
  const cont = document.getElementById('lista-historial');
  if (!filas.length) {
    cont.innerHTML = '<div class="card"><p class="vacio">No hay cajas en este rango.</p></div>';
    return;
  }
  cont.innerHTML = filas.map(f => {
    const estadoTexto = f.estado === 'Cerrado' ? 'Cerrada' : (f.estado === 'Abierto' ? 'Abierta' : f.estado);
    const novedad = f.motivos_novedad && f.motivos_novedad.length
      ? `<span style="color:var(--red)">⚠ ${escapeHtml(f.motivos_novedad.join(', '))}${f.estado_conciliacion === 'Resuelta' ? ' — ya conciliada' : ''}</span>`
      : '<span style="color:var(--green)">Sin novedades</span>';
    return `<div class="card historial-caja-fila" data-fecha="${escapeHtml(f.fecha)}" data-sede="${escapeHtml(f.sede)}" style="cursor:pointer">
      <h3 style="margin:0 0 6px">${escapeHtml(f.fecha)} — ${escapeHtml(f.sede)}</h3>
      <p style="margin:0 0 8px; font-size:.85rem; color:var(--grey)">
        ${estadoTexto} · Abrió ${escapeHtml(f.usuario_apertura || '—')}${f.usuario_cierre ? ` · Cerró ${escapeHtml(f.usuario_cierre)}` : ''}
      </p>
      <p style="margin:0; font-size:.88rem">
        Efectivo esperado: ${dinero_(f.efectivo_esperado)} · Efectivo contado: ${dinero_(f.efectivo_contado)} ·
        Caja fuerte: ${dinero_(f.caja_fuerte_esperada)}
      </p>
      <p style="margin:6px 0 0; font-size:.88rem">${novedad}</p>
    </div>`;
  }).join('');
  Array.from(document.querySelectorAll('.historial-caja-fila')).forEach(fila => {
    fila.addEventListener('click', () => {
      location.href = `caja.html?fecha=${encodeURIComponent(fila.dataset.fecha)}&sede=${encodeURIComponent(fila.dataset.sede)}`;
    });
  });
}
</script>
</body>
</html>
