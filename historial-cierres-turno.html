<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dilana OS — Histórico de cierres de turno</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="marca">Dilana <span>OS</span></div>
    <nav id="menu-nav"></nav>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Histórico de cierres de turno</h1>
      <div id="barra-usuario"></div>
    </div>

    <div class="card">
      <p style="color:var(--grey); font-size:.85rem; margin-top:0">
        Snapshot guardado al momento de cerrar cada turno — ventas y pagos Fudo, caja, traslados
        pendientes y diferencias de inventario (teórico vs. contado ese día). No se recalcula después.
      </p>
      <div class="grid grid-4" style="margin-bottom:14px">
        <div class="campo"><label>Desde</label><input type="date" id="filtro-desde"></div>
        <div class="campo"><label>Hasta</label><input type="date" id="filtro-hasta"></div>
        <div class="campo">
          <label>Sede</label>
          <select id="filtro-sede">
            <option value="Ambas">Ambas (todas)</option>
            <option>San Antonio</option>
            <option>Capri</option>
            <option>Centro de Producción</option>
          </select>
        </div>
        <div class="campo" style="display:flex; align-items:flex-end">
          <button class="btn dorado" id="btn-filtrar" style="width:100%">Filtrar</button>
        </div>
      </div>
      <p id="contador" class="vacio" style="display:none"></p>
    </div>

    <div id="lista-cierres"></div>
  </main>
</div>

<script src="assets/config.js"></script>
<script>
if (new URLSearchParams(location.search).get('embed') === '1') document.body.classList.add('embebido');
Sesion.requerir();
requerirRol_(['Administrador', 'Encargado', 'Lectura']);
montarBarraUsuario();
restringirSelectorSede_(document.getElementById('filtro-sede'));

const hoy = fechaLocalHoy_();
const hace30dias = (() => {
  const d = new Date();
  d.setDate(d.getDate() - 30);
  return d.toISOString().slice(0, 10);
})();
document.getElementById('filtro-desde').value = hace30dias;
document.getElementById('filtro-hasta').value = hoy;

document.getElementById('btn-filtrar').addEventListener('click', cargar);
cargar();

async function cargar() {
  const filtros = {
    fecha_desde: document.getElementById('filtro-desde').value,
    fecha_hasta: document.getElementById('filtro-hasta').value,
    sede: document.getElementById('filtro-sede').value
  };
  const data = await llamar('cierres_turno_listar', { filtros });
  if (!data.ok) { alert(data.error); return; }
  const filas = data.data || [];
  document.getElementById('contador').style.display = 'block';
  document.getElementById('contador').textContent = filas.length
    ? `${filas.length} cierre(s) en el rango`
    : 'No hay cierres en este rango.';
  pintar(filas);
}

function formatoMoneda_(n) {
  if (n === '' || n === undefined || n === null) return '—';
  return '$' + Number(n).toLocaleString('es-CO');
}

function pintar(filas) {
  const cont = document.getElementById('lista-cierres');
  if (!filas.length) {
    cont.innerHTML = '<div class="card"><p class="vacio">No hay cierres de turno en este rango.</p></div>';
    return;
  }
  cont.innerHTML = filas.map(f => {
    const ts = f.timestamp ? new Date(f.timestamp).toLocaleString('es-CO') : '—';
    const diffs = f.diferencias_inventario || [];
    const tablaDiffs = diffs.length
      ? `<table style="margin-top:10px; font-size:.85rem"><thead><tr><th>Producto</th><th>Contado</th><th>Teórico</th><th>Diferencia</th></tr></thead><tbody>` +
        diffs.map(d => `<tr>
          <td>${escapeHtml(d.producto)}</td>
          <td>${escapeHtml(d.contado)} ${escapeHtml(d.unidad || '')}</td>
          <td>${escapeHtml(d.teorico)} ${escapeHtml(d.unidad || '')}</td>
          <td>${Math.abs(d.diferencia) < 0.001 ? '<span class="badge ok">OK</span>' : escapeHtml(d.diferencia)}</td>
        </tr>`).join('') + '</tbody></table>'
      : (Number(f.diferencia_inventario) > 0
        ? '<p style="margin:8px 0 0; font-size:.85rem; color:var(--grey)">Detalle no guardado (cierre anterior a jul 2026) — <a href="libro-inventario.html">ver libro</a>.</p>'
        : '<p style="margin:8px 0 0; font-size:.85rem; color:var(--grey)">Sin diferencias de inventario ese día.</p>');
    return `<div class="card">
      <h3 style="margin:0 0 6px">${escapeHtml(formatearFechaLocal_(f.fecha))} — ${escapeHtml(f.sede)}</h3>
      <p style="margin:0 0 8px; font-size:.85rem; color:var(--grey)">Cerrado por ${escapeHtml(f.usuario)} · ${escapeHtml(ts)}</p>
      <p style="margin:0; font-size:.88rem">
        Ventas Fudo: ${formatoMoneda_(f.ventas_fudo_total)} ·
        Pagos Fudo: ${formatoMoneda_(f.pagos_fudo_total)} ·
        Efectivo esperado: ${formatoMoneda_(f.pagos_efectivo_esperado)} ·
        Efectivo contado: ${formatoMoneda_(f.efectivo_contado)} ·
        Diferencia caja: ${formatoMoneda_(f.diferencia_caja)}
      </p>
      <p style="margin:6px 0 0; font-size:.88rem">
        Traslados pendientes: ${escapeHtml(f.traslados_pendientes ?? 0)} ·
        Producciones: ${escapeHtml(f.producciones_registradas ?? 0)} ·
        Productos contados: ${escapeHtml(f.inventario_contado ?? '—')} ·
        Con diferencia inventario: ${escapeHtml(f.diferencia_inventario ?? 0)}
      </p>
      ${(Number(f.descuentos_total) > 0 || Number(f.propinas_total) > 0 || f.fuente_ventas || f.fuente_pagos)
        ? `<p style="margin:6px 0 0; font-size:.85rem; color:var(--grey)">` +
          (Number(f.descuentos_total) > 0 ? `Descuentos: ${formatoMoneda_(f.descuentos_total)} · ` : '') +
          (Number(f.propinas_total) > 0 ? `Propinas: ${formatoMoneda_(f.propinas_total)} · ` : '') +
          (f.fuente_ventas ? `Ventas desde ${escapeHtml(f.fuente_ventas)} · ` : '') +
          (f.fuente_pagos ? `Pagos desde ${escapeHtml(f.fuente_pagos)} · ` : '') +
          (f.sync_ventas_en ? `Sync ventas: ${escapeHtml(new Date(f.sync_ventas_en).toLocaleString('es-CO'))} · ` : '') +
          (f.sync_pagos_en ? `Sync pagos: ${escapeHtml(new Date(f.sync_pagos_en).toLocaleString('es-CO'))}` : '') +
          `</p>` : ''}
      ${f.observaciones ? `<p style="margin:6px 0 0; font-size:.85rem"><strong>Observaciones:</strong> ${escapeHtml(f.observaciones)}</p>` : ''}
      ${tablaDiffs}
    </div>`;
  }).join('');
}

function formatearFechaLocal_(v) {
  if (!v) return '';
  if (typeof v === 'string') return v.slice(0, 10);
  try { return new Date(v).toISOString().slice(0, 10); } catch (e) { return String(v); }
}
</script>
</body>
</html>
